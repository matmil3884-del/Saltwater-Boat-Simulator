name: Build Saltwater Fishing Simulator APK
on:
  workflow_dispatch:
  push:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          missing=0
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Required GitHub Actions secret $key is missing or empty. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Unity license secrets are present (values are not printed)."
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: SaltwaterBuild.BuildAndroid
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saltwater-Fishing-Simulator-APK
          path: BuildOutput/SaltwaterFishingSimulator.apk
