name: Build Saltwater Boat Simulator APK (Cloud Personal License)

on:
  workflow_dispatch:
  push:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/cloud-android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Validate Unity credentials without exposing secrets
        shell: bash
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          missing=0
          for key in UNITY_USERNAME UNITY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key."
              missing=1
            fi
          done

          if [ -n "$UNITY_SERIAL" ]; then
            echo "UNITY_SERIAL is configured."
          elif [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing Unity license. Set UNITY_LICENSE to the full contents of a valid Unity .ulf license file, or configure a supported UNITY_SERIAL."
            missing=1
          elif ! printf '%s' "$UNITY_LICENSE" | grep -qE '(<\?xml|<root|<UnityLicense|<License|<unityLicense)'; then
            echo "::error::UNITY_LICENSE exists but does not look like a Unity .ulf license file. Replace that secret with the full text contents of the valid .ulf file; do not enter a file path, password, activation request (.alf), or placeholder. Secret contents were not printed."
            missing=1
          else
            echo "UNITY_LICENSE has a license-file-like structure; Unity will validate it during activation."
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: SaltwaterBuild.BuildAndroid
          customParameters: -nographics
          allowDirtyBuild: true

      - name: Prepare APK artifact
        if: always()
        shell: bash
        run: |
          mkdir -p BuildOutput
          find . -type f -name 'SaltwaterFishingSimulator.apk' -not -path './BuildOutput/*' -exec cp {} BuildOutput/ \; || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saltwater-Boat-Simulator-Android-Build
          path: BuildOutput/SaltwaterFishingSimulator.apk
          if-no-files-found: warn
          retention-days: 7
