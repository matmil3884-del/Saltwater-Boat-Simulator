name: Build Saltwater Boat Simulator APK (Cloud Personal License)

on:
  workflow_dispatch:
  push:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/cloud-android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Check required Unity credentials are configured
        shell: bash
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          missing=0
          for key in UNITY_USERNAME UNITY_PASSWORD UNITY_LICENSE; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Unity credential and license secrets are present; values will not be printed."

      - name: Build Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: SaltwaterBuild.BuildAndroid
          customParameters: -nographics
          allowDirtyBuild: true

      - name: Prepare APK artifact
        if: always()
        shell: bash
        run: |
          mkdir -p BuildOutput
          find . -type f -name 'SaltwaterFishingSimulator.apk' -not -path './BuildOutput/*' -exec cp {} BuildOutput/ \; || true

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saltwater-Boat-Simulator-Android-Build
          path: |
            BuildOutput/SaltwaterFishingSimulator.apk
            /github/home/.config/unity3d/**
          if-no-files-found: warn
          retention-days: 7
