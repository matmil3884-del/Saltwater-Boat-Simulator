name: Build Saltwater Boat Simulator APK (Cloud Personal License)
# Re-trigger cloud build after Unity credential secrets are configured.

on:
  workflow_dispatch:
  push:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/cloud-android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Check required Unity credentials are configured
        shell: bash
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for key in UNITY_USERNAME UNITY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Unity credential secrets are present; values will not be printed."

      - name: Install Unity 2022.3.62f1 with Android module
        uses: buildalon/unity-setup@v2
        id: unity-setup
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          unity-version: 2022.3.62f1
          build-targets: Android
          cache-installation: true

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build APK
        shell: bash
        env:
          UNITY_EDITOR_PATH: ${{ steps.unity-setup.outputs.unity-editor-path }}
          UNITY_PROJECT_PATH: ${{ steps.unity-setup.outputs.unity-project-path }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/BuildOutput"
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -buildTarget Android \
            -executeMethod SaltwaterBuild.BuildAndroid \
            -logFile "$GITHUB_WORKSPACE/BuildOutput/unity-build.log"

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saltwater-Boat-Simulator-Android-Build
          path: |
            BuildOutput/SaltwaterFishingSimulator.apk
            BuildOutput/unity-build.log
          if-no-files-found: warn
          retention-days: 7
